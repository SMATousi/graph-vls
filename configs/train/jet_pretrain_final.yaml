# Production GVLS-on-jets pretraining config (prerequisite for T4.5): trains
# ONE model at the fixed, already-selected compression-optimal M (T4.3,
# specs/phase4/validation.md V-3 selected M=4) and persists a checkpoint,
# rather than sweeping a grid purely for comparison (configs/train/jet_pretrain.yaml).
# Same starting hyperparameters as the T4.3 sweep; epochs raised for a
# "production" run since this checkpoint is the one T4.5 actually freezes and
# reuses, meant to run unattended on a remote machine.
hidden_dim: 32
latent_dim: 8
k: 3
m: 4
graph_method: attention
prior: isotropic
mp_rounds: 1
lr: 0.01
beta: 0.001
lambda_: 1.0
epochs: 100
batch_size: 32
seed: 42

# T5.1 (specs/phase5/). "legacy" mean-reduces reconstruction over N^2 node
# pairs while dividing the KL by the latent node count M, so the effective
# beta is beta*N^2/M -- a constant reparameterization for Phases 0-3's single
# fixed-N graph, but N-dependent for jets (N spans 10-139 here). "per_jet"
# divides both terms by the same N^2, so beta means what it does in the
# beta-VAE literature (beta_eff = beta for every jet).
#
# Read gvls.losses.elbo.elbo's docstring before changing this: the two modes
# trade off against each other rather than one being strictly correct.
# "per_jet" makes the *raw* KL:recon ratio strongly N-dependent (measured
# corr -0.45), leaving large jets with very little KL pressure; "legacy"
# holds that ratio roughly constant but gives beta no per-graph-ELBO meaning.
normalization: legacy  # legacy (pre-Phase-5) | per_jet (T5.1)

# T5.1: which validation signal the best-epoch checkpoint is selected on.
# reconstruction_f1 was the pre-Phase-5 behaviour but correlates only +0.245
# with downstream accuracy across the usable beta range (V-0 Part B).
# Options: reconstruction_f1 | val_loss | probe_accuracy
selection_metric: probe_accuracy

# T5.3 (specs/phase5/): the pooled posterior's variance is currently the
# spread of a cluster's members, computed after column normalization divides
# out how many members it has -- verified: tiling the same node set 1x/2x/5x
# leaves var_pooled bit-identical. True divides it by the cluster's
# un-normalized mass n_m, making it the uncertainty OF THE MEAN (var/n).
# Because sum_m n_m == N identically, multiplicity then becomes exactly
# recoverable from the posterior -- and multiplicity is this dataset's
# strongest discriminant (logreg on N alone scores 0.7552 vs the pipeline's
# 0.7034). See gvls.models.pooling.LatentGraphPooling.forward.
occupancy_aware: false  # false (pre-Phase-5) | true (T5.3)
