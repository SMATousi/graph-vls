# T4.5: QGNNClassifier supervised training config. num_layers=1 is the
# starting default (NFR-2: keep circuit depth shallow so gradient estimation
# doesn't dominate wall-clock time); revisit only if reconstruction/
# classification fidelity demands more re-uploading layers.
num_layers: 1

# T4.10 (plan.md Design Decision 12): optimizer/lr/batch_size realigned to
# match the Lorentz-EQGNN literature baseline (sota-table.png Table II,
# Quark-Gluon dataset, 4 qubits -- matching our M=4) for direct
# comparability. Override back to optimizer=adam, lr=0.05, batch_size=32 for
# the project's own (non-comparability) experiments if still needed.
optimizer: adamw  # adamw (default, T4.10) | adam (pre-T4.10 default)
lr: 0.001
epochs: 50
batch_size: 16
seed: 42

# T4.8-followup: SPSA replaces parameter-shift as the default gradient
# estimator -- measured 14-24x fewer circuit evaluations per sample (grows
# with num_layers), independent of weight-parameter count. Set to
# param_shift to fall back to the exact (but far more expensive) gradient,
# e.g. for debugging or comparison. See src/gvls/models/qgnn.py module
# docstring and specs/phase4/validation.md V-8 for the measured numbers and
# the stochastic-gradient tradeoff this introduces.
gradient_method: spsa
spsa_epsilon: 1e-6
spsa_batch_size: 1

# T4.10 followup (validation.md V-11): "sum" (default, backward compatible)
# measures a single combined sum(Z_i) operator -- every qubit's contribution
# to the logit has a fixed, unweighted coefficient of 1.0. "learned" measures
# each qubit's Z separately and feeds the m-vector through a trainable
# classical Linear(m, 1) head instead, so the model can learn which pooled
# nodes matter more (the weighted-combination expressiveness a classical
# linear model has for free). Note: "learned" measurably increases circuit
# evaluations per gradient step (proportional to m -- e.g. m=4 measured
# SPSA 2->8, param_shift 28->112 pubs), unlike num_layers, which SPSA's cost
# is independent of. See src/gvls/models/qgnn.py module docstring.
readout_mode: sum  # sum (default) | learned
