defaults:
  - data: qg_jets
  - train: qgnn_classifier
  - _self_

gvls_checkpoint_path: checkpoints/gvls_jets_m4.pt
qgnn_checkpoint_path: checkpoints/qgnn_jets_m4.pt

wandb:
  project: graph-vls
  mode: offline
  # name/group null|default -> train_qgnn.py falls back to "qgnn-M{m}" /
  # "qgnn-jet-classification". Overridden per-run for the T4.10 Lorentz-
  # EQGNN comparability sweep so runs at different num_jets/seeds are
  # distinguishable in the W&B UI (specs/phase4/validation.md V-10).
  name: null
  group: qgnn-jet-classification
  tags: []

hydra:
  run:
    dir: outputs/${now:%Y-%m-%d}/${now:%H-%M-%S}
  job:
    chdir: false
