# T4.10 (validation.md V-10): reproduces the Lorentz-EQGNN literature
# protocol exactly (arXiv:2411.01641 Section IV.A.1) -- a single random draw
# of num_train + num_val + num_test jets with >= min_particles particles each
# (no forced 50/50 class balance), sliced positionally into train/val/test.
# This is NOT qg_jets.yaml's exact-50/50 draw + independent ratio split.
#
# train_subset=800 reproduces Table II's "800 (subset)" row: only the
# training set is shrunk for the data-scarcity comparison -- validation and
# test stay fixed at 1250/1250, matching the paper (it does not shrink
# val/test to match the 800-jet training subset). Set train_subset to null
# to use the full 10000-jet training draw instead.
name: qg_jets
protocol: lorentz
k_graph_cap: 8
seed: 42
num_train: 10000
num_val: 1250
num_test: 1250
min_particles: 10
train_subset: 800
